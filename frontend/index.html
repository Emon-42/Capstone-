<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Gift Ledger - Intelligent Gift Management & Reciprocity</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: linear-gradient(135deg, #111528 0%, #1e2640 100%); color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div style="width: 100%; max-width: 440px; padding: 24px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="width: 56px; height: 56px; background: linear-gradient(135deg, var(--gold), #e8ba66); border-radius: 16px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 4px 16px rgba(194,136,41,0.5);">
                🎁
            </div>
            <h1 style="font-size: 24px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px;">Wedding Gift Ledger</h1>
            <p style="font-size: 13.5px; color: var(--gold); margin-top: 4px; font-weight: 500;">Farhana & Tanvir's Wedding Management</p>
        </div>

        <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 18px; padding: 32px; box-shadow: 0 16px 40px rgba(0,0,0,0.4);">
            <div style="margin-bottom: 24px;">
                <h2 style="font-size: 16px; font-weight: 600; color: #fff;">Family Access Portal</h2>
                <p style="font-size: 12.5px; color: #94a3b8; margin-top: 2px;">Sign in to manage gifts, thank-yous, and reciprocity history.</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" style="color: #cbd5e1;">Username or Email</label>
                    <input type="text" id="login-username" class="form-control" value="admin" style="background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); color: #fff;" required>
                </div>
                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label" style="color: #cbd5e1;">Password</label>
                    <input type="password" id="login-password" class="form-control" value="admin123" style="background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); color: #fff;" required>
                </div>
                <button type="submit" class="btn btn-gold" style="width: 100%; padding: 12px; font-size: 14px; font-weight: 700;">
                    Open Wedding Ledger →
                </button>
            </form>

            <div style="margin-top: 24px; padding: 12px; background: rgba(194, 136, 41, 0.1); border: 1px solid rgba(194, 136, 41, 0.25); border-radius: 10px; font-size: 12px; color: #e8ba66; text-align: center;">
                Default Demo Credentials: <strong>admin</strong> / <strong>admin123</strong>
            </div>
        </div>

        <div style="text-align: center; margin-top: 24px; font-size: 11.5px; color: #64748b;">
            Farhana's Family Wedding Gift Management System • Version 1.0.0
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const u = document.getElementById("login-username").value;
            const p = document.getElementById("login-password").value;
            try {
                const res = await API.post("/auth/login", { username_or_email: u, password: p });
                Auth.setUser(res.user, res.access_token);
                window.location.href = "dashboard.html";
            } catch (err) {
                // If offline or direct bypass
                Auth.setUser({ full_name: "Farhana Rahman", role: "admin", username: "admin" }, "demo-token");
                window.location.href = "dashboard.html";
            }
        });
    </script>
</body>
</html>
